options:
  landscape-api-uri:
    type: string
    description: |
      Base URL of the Landscape API (required), e.g.
      https://landscape.example.com/api/. Its host is also the hostname
      HAProxy routes /mcp on, so use the external Landscape URL. The unit is
      blocked until this is set.
  landscape-api-credentials:
    type: secret
    description: |
      ID of a Juju secret holding the Landscape API credentials, with the
      fields `api-key` and `api-secret`. The secret must be granted to this
      application with `juju grant-secret`.
  port:
    type: int
    default: 8080
    description: Port the MCP server listens on inside the container.
