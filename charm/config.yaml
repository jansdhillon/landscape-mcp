options:
  landscape-api-uri:
    type: string
    default: "https://landscape.canonical.com/api/"
    description: Base URL of the Landscape API.
  landscape-api-credentials:
    type: secret
    description: |
      ID of a Juju secret holding the Landscape API credentials, with the
      fields `api-key` and `api-secret`. The secret must be granted to this
      application with `juju grant-secret`.
  port:
    type: int
    default: 8080
    description: Port the MCP server listens on inside the container.
