name: landscape-mcp
display-name: Landscape MCP Server
description: |
  A Kubernetes charm for the Landscape MCP server, exposing the Landscape
  API to AI agents over streamable HTTP. Can be published through the same
  HAProxy as landscape-server via the haproxy-route relation.
maintainers:
  - Landscape Developers <landscape-devel@lists.canonical.com>
summary: MCP server for the Landscape API (streamable HTTP).

assumes:
  - k8s-api

containers:
  landscape-mcp:
    resource: landscape-mcp-image

resources:
  landscape-mcp-image:
    type: oci-image
    description: OCI image for the Landscape MCP server
    upstream-source: ghcr.io/jansdhillon/landscape-mcp:latest

requires:
  mcp-haproxy-route:
    interface: haproxy-route
    limit: 1
    optional: true
