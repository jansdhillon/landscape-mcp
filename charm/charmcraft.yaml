# Learn more at https://juju.is/docs/sdk/charmcraft-config
type: "charm"

platforms:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:

charm-libs:
  - lib: haproxy.haproxy_route
    version: "1.13"

parts:
  # "uv-deps" is a magic part name charmcraft uses to satisfy the uv plugin's
  # environment validation before the charm part runs
  uv-deps:
    plugin: nil
    build-packages:
      - curl
    override-build: |
      curl -LsSf https://astral.sh/uv/0.10.8/install.sh | sh
      ln -sf "$HOME/.local/bin/uv" /usr/local/bin/uv
  charm:
    plugin: uv
    source: .
    after:
      - uv-deps
