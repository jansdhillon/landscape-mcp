[project]
name = "landscape-mcp-operator"
version = "0.1.0"
description = "Kubernetes charm for the Landscape MCP server"
requires-python = ">=3.12"
dependencies = [
    "ops>=2.17",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ops-scenario",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Skip vendored dependencies
extend-exclude = ["lib"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "lib", "src"]
