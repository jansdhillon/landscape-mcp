name: Publish image to GHCR

# Rebuilds the rock and pushes it to GHCR when the server code changes on
# main, then releases the charm with the new image as its resource.
on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "rockcraft.yaml"
      - ".github/workflows/publish-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jansdhillon/landscape-mcp

jobs:
  test:
    name: Test server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  publish:
    name: Pack and push rock
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: canonical/craft-actions/rockcraft/setup@v1

      # The charm and its Charmhub resource are amd64 only.
      - name: Pack rock
        run: rockcraft pack --platform amd64 --verbosity brief

      - name: Push to GHCR
        id: push
        env:
          CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          rock=$(ls landscape-mcp_*_amd64.rock)
          sha_tag="sha-${GITHUB_SHA::12}"
          for tag in "$sha_tag" latest; do
            rockcraft.skopeo --insecure-policy copy --dest-creds "$CREDS" \
              "oci-archive:$rock" "docker://$IMAGE:$tag"
          done
          digest=$(rockcraft.skopeo inspect --creds "$CREDS" \
            --format '{{.Digest}}' "docker://$IMAGE:$sha_tag")
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$sha_tag and :latest ($digest)" >> "$GITHUB_STEP_SUMMARY"

  release-charm:
    name: Release charm with new image
    needs: publish
    uses: ./.github/workflows/publish-charm.yaml
    with:
      image: ${{ needs.publish.outputs.image }}
    secrets: inherit
