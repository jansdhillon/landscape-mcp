name: Publish charm to Charmhub

# Packs and uploads the charm and releases it to latest/edge. When called
# with an image (from publish-image.yaml), that image is uploaded as a new
# landscape-mcp-image resource revision; otherwise the latest uploaded
# resource revision is attached.
on:
  push:
    branches:
      - main
    paths:
      - "charm/**"
      - "!charm/tests/**"
      - "!charm/**/*.md"
      - ".github/workflows/publish-charm.yaml"
  workflow_dispatch:
    inputs:
      image:
        description: Image to upload as a new resource revision (e.g. ghcr.io/jansdhillon/landscape-mcp@sha256:...); empty reuses the latest one
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      image:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CHARM: landscape-mcp
  RESOURCE: landscape-mcp-image
  CHANNEL: latest/edge

jobs:
  test:
    name: Lint and test charm
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Lint
        run: make check

      - name: Unit tests
        run: make test

  release:
    name: Pack, upload and release charm
    needs: test
    runs-on: ubuntu-24.04
    # Serialise Charmhub releases so a charm-only run and an image run
    # triggered by the same push cannot release out of order.
    concurrency:
      group: charmhub-landscape-mcp
      cancel-in-progress: false
    env:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: canonical/craft-actions/charmcraft/setup@v1

      - name: Pack charm
        working-directory: charm
        run: charmcraft pack --platform ubuntu@24.04:amd64 --verbosity brief

      - name: Resolve resource revision
        id: resource
        run: |
          if [ -n "$IMAGE" ]; then
            revision=$(charmcraft upload-resource "$CHARM" "$RESOURCE" \
              --image="docker://$IMAGE" --format json | jq -r .revision)
          else
            revision=$(charmcraft resource-revisions "$CHARM" "$RESOURCE" \
              --format json | jq -r 'map(.revision) | max')
          fi
          if [ -z "$revision" ] || [ "$revision" = null ]; then
            echo "Could not determine a $RESOURCE revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Upload and release charm
        env:
          RESOURCE_REVISION: ${{ steps.resource.outputs.revision }}
        run: |
          charm=$(ls charm/"$CHARM"_*.charm)
          revision=$(charmcraft upload "$charm" --release "$CHANNEL" \
            --resource "$RESOURCE:$RESOURCE_REVISION" --format json | jq -r .revision)
          echo "Released $CHARM revision $revision with $RESOURCE:$RESOURCE_REVISION to $CHANNEL" \
            | tee -a "$GITHUB_STEP_SUMMARY"
