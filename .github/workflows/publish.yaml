name: Publish

# One pipeline per push to main:
#   1. If the server changed, test it, pack the rock and push it to GHCR.
#   2. If the server or the charm changed, test the charm, pack it and release
#      it to latest/edge once, with the new image as a new resource revision
#      when step 1 ran, otherwise with the latest existing resource revision.
on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "rockcraft.yaml"
      - "charm/**"
  workflow_dispatch:
    inputs:
      image:
        description: Rebuild and push the image before releasing the charm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jansdhillon/landscape-mcp
  CHARM: landscape-mcp
  RESOURCE: landscape-mcp-image
  CHANNEL: latest/edge

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.diff.outputs.image }}
      charm: ${{ steps.diff.outputs.charm }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Diff against the previous main
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_IMAGE: ${{ inputs.image }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "image=$DISPATCH_IMAGE" >> "$GITHUB_OUTPUT"
            echo "charm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            # Unknown base (new branch or force push): publish everything.
            files=$(git ls-files)
          fi
          image=false
          charm=false
          if grep -qE '^(cmd/|internal/|go\.mod$|go\.sum$|rockcraft\.yaml$)' <<<"$files"; then
            image=true
          fi
          if grep -E '^charm/' <<<"$files" | grep -vqE '^charm/tests/|\.md$'; then
            charm=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "charm=$charm" >> "$GITHUB_OUTPUT"
          echo "image=$image charm=$charm" >> "$GITHUB_STEP_SUMMARY"

  test-server:
    name: Test server
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  test-charm:
    name: Lint and test charm
    needs: changes
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.charm == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: charm
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Lint
        run: make check

      - name: Unit tests
        run: make test

  rock:
    name: Pack and push rock
    needs: [test-server, test-charm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: canonical/craft-actions/rockcraft/setup@v1

      # The charm and its Charmhub resource are amd64 only.
      - name: Pack rock
        run: rockcraft pack --platform amd64 --verbosity brief

      - name: Push to GHCR
        id: push
        env:
          CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          rock=$(ls landscape-mcp_*_amd64.rock)
          sha_tag="sha-${GITHUB_SHA::12}"
          for tag in "$sha_tag" latest; do
            rockcraft.skopeo --insecure-policy copy --dest-creds "$CREDS" \
              "oci-archive:$rock" "docker://$IMAGE:$tag"
          done
          digest=$(rockcraft.skopeo inspect --creds "$CREDS" \
            --format '{{.Digest}}' "docker://$IMAGE:$sha_tag")
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$sha_tag and :latest ($digest)" >> "$GITHUB_STEP_SUMMARY"

  charm:
    name: Pack, upload and release charm
    needs: [changes, test-charm, rock]
    # Runs when the rock was pushed or skipped, but not when anything failed.
    if: >-
      !cancelled() && !failure() &&
      (needs.changes.outputs.image == 'true' || needs.changes.outputs.charm == 'true')
    runs-on: ubuntu-24.04
    env:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
      NEW_IMAGE: ${{ needs.rock.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: canonical/craft-actions/charmcraft/setup@v1

      - name: Pack charm
        working-directory: charm
        run: charmcraft pack --platform ubuntu@24.04:amd64 --verbosity brief

      - name: Resolve resource revision
        id: resource
        run: |
          if [ -n "$NEW_IMAGE" ]; then
            revision=$(charmcraft upload-resource "$CHARM" "$RESOURCE" \
              --image="docker://$NEW_IMAGE" --format json | jq -r .revision)
          else
            revision=$(charmcraft resource-revisions "$CHARM" "$RESOURCE" \
              --format json | jq -r 'map(.revision) | max')
          fi
          if [ -z "$revision" ] || [ "$revision" = null ]; then
            echo "Could not determine a $RESOURCE revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Upload and release charm
        env:
          RESOURCE_REVISION: ${{ steps.resource.outputs.revision }}
        run: |
          charm=$(ls charm/"$CHARM"_*.charm)
          revision=$(charmcraft upload "$charm" --release "$CHANNEL" \
            --resource "$RESOURCE:$RESOURCE_REVISION" --format json | jq -r .revision)
          echo "Released $CHARM revision $revision with $RESOURCE:$RESOURCE_REVISION to $CHANNEL" \
            | tee -a "$GITHUB_STEP_SUMMARY"
